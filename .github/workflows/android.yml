name: Android prototype APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test native core on host (not gameplay tests)
        run: sh native-core/build-test.sh
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK and install required packages
        shell: bash
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Preinstalled sdkmanager is missing"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if ! "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > "$RUNNER_TEMP/sdk.log" 2>&1; then
            cat "$RUNNER_TEMP/sdk.log"
            python3 -c 'import pathlib,os; s=pathlib.Path(os.environ["RUNNER_TEMP"]+"/sdk.log").read_text()[-6000:]; print("::error title=Android SDK setup::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK (prototype only)
        shell: bash
        run: |
          if ! gradle --no-daemon :app:assembleDebug --stacktrace > "$RUNNER_TEMP/gradle-build.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle-build.log"
            python3 -c 'import pathlib,os; s=pathlib.Path(os.environ["RUNNER_TEMP"]+"/gradle-build.log").read_text(); lines=s.splitlines(); selected="\n".join([x for x in lines if any(k in x for k in ["FAILURE", "What went wrong", "Execution failed", "Caused by:", "error:", "Could not", "requires", "not found", "failed"])])[:7000]; print("::error title=APK build::"+(selected or s[-6000:]).replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          tail -n 35 "$RUNNER_TEMP/gradle-build.log"
      - name: Verify APK and create download directory
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KHC-Brawl-prototype-debug.apk
          sha256sum dist/KHC-Brawl-prototype-debug.apk > dist/SHA256SUMS.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KHC-Brawl-prototype-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
