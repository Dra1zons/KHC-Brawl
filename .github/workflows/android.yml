name: Android prototype APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test native core on host (not gameplay tests)
        run: sh native-core/build-test.sh
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build tools, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK (prototype only)
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK and create download directory
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KHC-Brawl-prototype-debug.apk
          sha256sum dist/KHC-Brawl-prototype-debug.apk > dist/SHA256SUMS.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KHC-Brawl-prototype-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
