name: Publish integration build report
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-report.yml']
  workflow_run:
    workflows: ['In-client integration checks and APK']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  checks: read
concurrency:
  group: integration-build-report
  cancel-in-progress: false
jobs:
  report:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record build status on ci-status branch
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            let run = context.payload.workflow_run;
            if (!run) {
              const response = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'client-integration.yml', branch: 'main', per_page: 1});
              run = response.data.workflow_runs[0];
            }
            const report = {updated_at: new Date().toISOString(), kind: 'integration-status', run: null, jobs: [], artifacts: [], game_apk_built: false};
            if (run) {
              report.run = {number: run.run_number, status: run.status, conclusion: run.conclusion, url: run.html_url, commit: run.head_sha};
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id: run.id, per_page: 100});
              for (const job of jobs) {
                const entry = {name: job.name, status: job.status, conclusion: job.conclusion, steps: (job.steps || []).map(s => ({name: s.name, conclusion: s.conclusion})), errors: []};
                if (job.check_run_url && job.conclusion === 'failure') {
                  const checkId = Number(job.check_run_url.split('/').pop());
                  const annotations = await github.paginate(github.rest.checks.listAnnotations, {owner, repo, check_run_id: checkId, per_page: 100});
                  entry.errors = annotations.filter(a => a.annotation_level === 'failure').map(a => ({title: a.title, message: (a.message || '').slice(0, 7000)})).slice(0, 5);
                }
                report.jobs.push(entry);
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id: run.id, per_page: 100});
              report.artifacts = artifacts.map(a => ({name: a.name, expired: a.expired, size: a.size_in_bytes, url: `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${a.id}`}));
              report.game_apk_built = run.conclusion === 'success' && report.artifacts.some(a => a.name.startsWith('KHC-integrated-game-test-') && !a.expired);
            }
            const branch = 'ci-status';
            try { await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch}); }
            catch (error) {
              if (error.status !== 404) throw error;
              const base = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
              await github.rest.git.createRef({owner, repo, ref: 'refs/heads/' + branch, sha: base.data.object.sha});
            }
            const path = 'reports/integration-latest.json';
            let sha;
            try { const previous = await github.rest.repos.getContent({owner, repo, path, ref: branch}); sha = previous.data.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner, repo, branch, path, sha, message: 'Record integration build result', content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64')});
            core.notice(report.game_apk_built ? 'Integrated game APK artifact exists; device runtime not verified.' : 'No confirmed integrated game APK. See the ci-status report.');
