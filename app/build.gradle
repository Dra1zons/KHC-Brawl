plugins { id "com.android.application" }
android {
    namespace "io.ebensos.brawlmenu"
    compileSdk 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "io.ebensos.brawlmenu"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-prototype"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DMODCORE_BUILD_TESTS=OFF", "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                targets "khc_core"
            }
        }
    }
    externalNativeBuild {
        cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
